<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="ChurchFlow Admin — a calm operating system for church leaders." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Heirs of Promise · Church workspace</title>
    <style>
      #app-startup{box-sizing:border-box;min-height:100svh;display:grid;align-content:center;justify-items:start;padding:clamp(1.5rem,8vw,8rem);background:#fff;color:#27312d;font:16px/1.65 sans-serif}
      #app-startup h1{font-size:clamp(2rem,5vw,3rem);font-weight:600;margin:.5rem 0}#app-startup p{max-width:32rem;color:#6e7b74}
      #startup-retry{border:1px solid #245c4d;border-radius:.5rem;background:#245c4d;color:#fff;padding:.8rem 1.3rem;font:inherit;cursor:pointer}
      #startup-retry:hover{background:#3e806d}#startup-retry:focus-visible{outline:2px solid #245c4d;outline-offset:4px}
    </style>
  </head>
  <body>
    <div id="root">
      <section id="app-startup" data-testid="app-startup" aria-live="polite">
        <p data-testid="startup-brand">CHURCHFLOW · HEIRS OF PROMISE SANCTUARY</p>
        <h1 id="startup-title" data-testid="startup-title">Opening your workspace…</h1>
        <p id="startup-message" data-testid="startup-message">Connecting you to your church community.</p>
        <button id="startup-retry" data-testid="startup-retry-button" hidden>Try again</button>
        <noscript><p data-testid="javascript-required">JavaScript is required to open ChurchFlow. Please enable it in your browser settings.</p></noscript>
      </section>
    </div>
    <script src="/boot.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
