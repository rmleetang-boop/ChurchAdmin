<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>ChurchFlow — You're offline</title>
    <style>
      body{margin:0;min-height:100svh;display:grid;place-items:center;background:#fff;color:#27312d;font:16px/1.65 sans-serif}
      main{box-sizing:border-box;width:min(100%,32rem);padding:2rem}h1{font-size:2rem;font-weight:600}p{color:#6e7b74}
      button{border:1px solid #245c4d;border-radius:.5rem;background:#245c4d;color:#fff;padding:.8rem 1.3rem;font:inherit;cursor:pointer}
      button:hover{background:#3e806d}button:focus-visible{outline:2px solid #245c4d;outline-offset:4px}
    </style>
  </head>
  <body>
    <main data-testid="offline-page">
      <p data-testid="offline-brand">CHURCHFLOW · HEIRS OF PROMISE SANCTUARY</p>
      <h1 data-testid="offline-title">You're offline.</h1>
      <p data-testid="offline-description">Reconnect to the internet to open your church workspace. Your private church information is not stored on this offline page.</p>
      <button data-testid="offline-retry-button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
