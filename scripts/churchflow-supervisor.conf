[program:churchflow-web]
command=/bin/bash -c 'set -a; source /app/.env; set +a; NODE_ENV=production exec node dist/index.js'
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/churchflow-web.out.log
stderr_logfile=/var/log/supervisor/churchflow-web.err.log
stopasgroup=true
killasgroup=true

[program:churchflow-api]
command=/bin/bash -c 'set -a; source /app/.env; set +a; NODE_ENV=production PORT=$API_PORT exec node dist/index.js'
directory=/app
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/churchflow-api.out.log
stderr_logfile=/var/log/supervisor/churchflow-api.err.log
stopasgroup=true
killasgroup=true